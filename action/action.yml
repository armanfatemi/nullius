name: 'nullius claims check'
description: >-
  Verify Evidence Anchors — machine-verifiable claims about the codebase in
  design docs, PR descriptions, and agent-written proposals. Advisory PR
  comment by default; a hard gate with strict.
branding:
  icon: 'check-circle'
  color: 'gray-dark'

inputs:
  globs:
    description: >-
      Space-separated glob patterns for the documents to check (quoted so the
      shell does not expand them), e.g. "docs/rfcs/**/*.md". Omit to use the
      "docs" key of nullius.config.json. If neither is present, the docs check
      is skipped (PR-body mode can still run).
    default: ''
  pr-body:
    description: >-
      Also check the pull request description itself for Evidence Anchors —
      the one claim-carrying document every workflow has. Runs only on
      pull_request events. Default true.
    default: 'true'
  config:
    description: Path to a nullius.config.json (defaults to repo root if present).
    default: ''
  strict:
    description: Fail the job when any claim is unverified. Default false (advisory).
    default: 'false'
  require-markers:
    description: >-
      Fail when any matched document carries no grounding markers. The floor is
      per document, so one anchored file cannot license the rest. Default false.
    default: 'false'
  comment:
    description: Upsert a PR comment with the report (needs github-token). Default true.
    default: 'true'
  github-token:
    description: Token for the PR comment (needs pull-requests write permission).
    default: ''
  run-report:
    description: >-
      Post a second comment describing how the pull request was produced —
      agent dispatches, review rounds, mutations and the coordinator's own
      ledger records — read from a committed `nullius.runs/` envelope written
      by `nullius-kit witness bundle`. Off by default: it renders nothing
      useful without that envelope, and a repository that does not record its
      runs should not be told about a file it will never have.
    default: 'false'
  run-report-bundle:
    description: >-
      Path to the envelope. Empty means the conventional
      `nullius.runs/<branch-slug>.json`. A path that holds nothing is an
      absence the report renders, never an error — the code-verified tier does
      not depend on the bundle and is what a maintainer reads first.
    default: ''
  claims-version:
    description: >-
      Version of @nullius-inverba/claims to run. Pinned by default, because
      pinning this action without pinning its checker is not a pin: every run
      would fetch npm's `latest`, and a breaking CLI change would reach every
      caller the day it published. Set to `latest` to opt into that instead.
    default: '0.11.0'

runs:
  using: composite
  steps:
    - name: Run checker
      id: check
      shell: bash
      env:
        CLAIMS_VERSION: ${{ inputs.claims-version }}
        GLOBS: ${{ inputs.globs }}
        CONFIG: ${{ inputs.config }}
        REQUIRE_MARKERS: ${{ inputs.require-markers }}
        PR_BODY_MODE: ${{ inputs.pr-body }}
      run: |
        set +e
        status=0
        combined=""

        run_docs=false
        if [ -n "$GLOBS" ]; then
          run_docs=true
        elif [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; then
          run_docs=true
        elif [ -f nullius.config.json ]; then
          run_docs=true
        fi

        if [ "$run_docs" = "true" ]; then
          args=()
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          if [ "$REQUIRE_MARKERS" = "true" ]; then
            args+=(--require-markers)
          fi
          # Globs are word-split deliberately so multiple patterns work; the
          # CLI does its own globbing, so patterns must reach it unexpanded.
          # shellcheck disable=SC2086
          docs_output=$(npx -y "@nullius-inverba/claims@${CLAIMS_VERSION}" check $GLOBS "${args[@]}" 2>&1)
          docs_status=$?
          if [ $docs_status -ne 0 ]; then status=$docs_status; fi
          combined="=== docs ===
        $docs_output"
        fi

        if [ "$PR_BODY_MODE" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          # Read the body from the event file, never via expression
          # interpolation — the description is PR-controlled content.
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > .nullius-pr-description.md
          if [ -s .nullius-pr-description.md ]; then
            body_output=$(npx -y "@nullius-inverba/claims@${CLAIMS_VERSION}" check .nullius-pr-description.md 2>&1)
            body_status=$?
            if [ $body_status -ne 0 ]; then status=$body_status; fi
          else
            body_output="(empty PR description — nothing to check)"
          fi
          rm -f .nullius-pr-description.md
          combined="$combined

        === PR description ===
        $body_output"
        fi

        if [ -z "$combined" ]; then
          combined="Nothing to check: no globs, no nullius.config.json, and no PR body target."
        fi
        set -e

        echo "$combined"
        {
          echo '## nullius claims check'
          echo '```'
          echo "$combined"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        echo "status=$status" >> "$GITHUB_OUTPUT"
        {
          echo 'output<<NULLIUS_EOF'
          echo "$combined"
          echo 'NULLIUS_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Grounding card
      id: card
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        CLAIMS_VERSION: ${{ inputs.claims-version }}
        GLOBS: ${{ inputs.globs }}
        CONFIG: ${{ inputs.config }}
        REQUIRE_MARKERS: ${{ inputs.require-markers }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -uo pipefail
        # The document versions this Action can render a card from. A SET, for
        # the same reason the run report keeps one: this Action re-invokes a
        # pinned `claims-version`, so a caller on an older pin produces an older
        # document, and an equality would stop rendering for all of them the day
        # a newer one is understood.
        ACCEPTED_CHECK_VERSIONS='1'

        run_docs=false
        if [ -n "$GLOBS" ] || { [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; } || [ -f nullius.config.json ]; then
          run_docs=true
        fi
        if [ "$run_docs" != "true" ]; then
          echo 'rendered=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        args=()
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ "$REQUIRE_MARKERS" = "true" ] && args+=(--require-markers)

        # The PR description is a checked document like any other, and the
        # human-format step above checks it. If the card did not, a failing
        # anchor in the body would fail the job while the card said every
        # marker verified — a green table over a red run, which is the symptom
        # this change's own compatibility section names.
        targets=()
        # shellcheck disable=SC2206
        targets=($GLOBS)
        if [ "$PR_BODY_MODE" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > .nullius-pr-description.md
          if [ -s .nullius-pr-description.md ]; then
            targets+=(.nullius-pr-description.md)
          fi
        fi

        # Streams SPLIT, not merged. The human step above uses `2>&1` because
        # its output has no contract; a JSON document does, and any diagnostic
        # written to stderr would corrupt it. A parser lenient enough to recover
        # from that is a parser lenient enough to accept a truncated report.
        npx -y "@nullius-inverba/claims@${CLAIMS_VERSION}" check "${targets[@]}" "${args[@]}" \
          --format json > nullius-card.json 2> nullius-card.err || true

        version=$(jq -r '.version // "absent"' nullius-card.json 2>/dev/null || echo 'unparseable')
        known=no
        for accepted in $ACCEPTED_CHECK_VERSIONS; do
          [ "$version" = "$accepted" ] && known=yes
        done
        if [ "$known" != 'yes' ]; then
          # Decision 6: refuse rather than parse a document whose field
          # expectations may have moved. `jq` returns null for a missing field
          # rather than failing, so a partial parse would render a green-looking
          # card over a red run — visible only by comparing it to the exit code.
          {
            echo '## nullius claims check'
            echo
            echo "No card: this action renders check-report version(s) \`${ACCEPTED_CHECK_VERSIONS}\`,"
            echo "and the checker produced \`${version}\`. The unstructured report is above."
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'rendered=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Stderr kept, not discarded: a checker too old to know `--format card`
        # fails here, and Decision 6 requires a stated reason rather than a
        # silent fallback. The pinned default is exactly that case until the
        # release carrying this format lands.
        card_status=0
        npx -y "@nullius-inverba/claims@${CLAIMS_VERSION}" check "${targets[@]}" "${args[@]}" \
          --format card --link-base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" \
          > nullius-card.md 2> nullius-card-render.err || card_status=$?
        if [ "$card_status" -ne 0 ] || [ ! -s nullius-card.md ]; then
          {
            echo '## nullius claims check'
            echo
            echo "No card: \`check --format card\` did not render (exit ${card_status}). The"
            echo 'unstructured report is above. This is expected when `claims-version` predates'
            echo 'the release that added the format.'
            echo '```'
            cat nullius-card-render.err 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f .nullius-pr-description.md
          echo 'rendered=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rm -f .nullius-pr-description.md

        # Annotations. Severity matches the gate: a red annotation on a green
        # job teaches a reader that annotations are decorative.
        level=warning
        [ "$STRICT" = "true" ] && level=error
        # Workflow-command escaping, and it is not the same escaping the card
        # uses: `%25` first or it would double-encode the others, then CR/LF,
        # then `::` which would otherwise close the command and let the rest of
        # a PR-controlled string run as a new one. Results with no file anchor
        # are skipped here and remain in the card, which is the complete record.
        # Workflow-command escaping, and there are TWO encodings rather than one.
        # A property value (`file=`) additionally escapes `:` and `,`, either of
        # which would end the property and begin another — and `source.doc` comes
        # from a PR-controlled document. An earlier draft escaped only the
        # message and let a newline in a path split the annotation in two,
        # putting attacker-controlled text at the start of its own line. The CI
        # assertion over the adversarial fixture is what caught that.
        jq -r --arg level "$level" '
          def msg: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub("::"; "%3A%3A");
          def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
          .documents[]?.results[]?
          | select(.failing)
          | select(.verdict != "canary-present")
          | select((.source.doc // "") != "")
          | "::\($level) file=\(.source.doc | prop),line=\(.source.line)::\(.detail // "" | msg)"
        ' nullius-card.json || true

        echo 'rendered=true' >> "$GITHUB_OUTPUT"
        {
          echo 'card<<NULLIUS_CARD_EOF'
          cat nullius-card.md
          echo 'NULLIUS_CARD_EOF'
        } >> "$GITHUB_OUTPUT"
        if [ -s nullius-card.err ]; then
          {
            echo
            echo '<details><summary>checker diagnostics</summary>'
            echo
            echo '```'
            cat nullius-card.err
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upsert PR comment
      if: >-
        inputs.comment == 'true' && inputs.github-token != '' &&
        github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.check.outputs.output }}
        STATUS: ${{ steps.check.outputs.status }}
        CARD: ${{ steps.card.outputs.card }}
        CARD_RENDERED: ${{ steps.card.outputs.rendered }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # The marker is unchanged and stays the first line of the body. The
        # upsert finds its own comment by `startswith`, so changing what the
        # comment says must not change how it is found — otherwise the first
        # run after this lands posts a second comment instead of editing the
        # first, on every open pull request at once.
        marker='<!-- nullius-claims -->'
        footer='_[Evidence Anchors](https://github.com/armanfatemi/nullius/blob/main/spec/evidence-anchors.md): open the cited file and correct the claim, or move it to "Open questions"._'

        if [ "$CARD_RENDERED" = "true" ] && [ -n "$CARD" ]; then
          # The card carries its own headline, computed from the summary of the
          # run that produced it.
          #
          # It is NOT the same run as the one behind `status`: that comes from
          # the human-format step above, over the same globs but invoked
          # separately. They agree in practice and nothing enforces it, so the
          # unstructured report stays beneath the card rather than being
          # replaced by it — a reader who doubts the card has the other run's
          # output in the same comment.
          #
          # The card also covers the same target set as that step, PR body
          # included, so the two cannot disagree about *what* was checked.
          # Before that was true, a failing PR-body anchor could fail the job
          # while the card reported everything verified.
          body=$(printf '%s\n%s\n\n<details><summary>Full report</summary>\n\n```\n%s\n```\n\n</details>\n\n%s\n' \
            "$marker" "$CARD" "$REPORT" "$footer")
        else
          if [ "$STATUS" = "0" ]; then
            headline='✅ all grounding markers verified'
          else
            headline='❌ unverified claims found'
          fi
          body=$(printf '%s\n## nullius claims check — %s\n\n```\n%s\n```\n\n%s\n' \
            "$marker" "$headline" "$REPORT" "$footer")
        fi

        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
          | jq -r --arg m "$marker" '[.[] | select(.body | startswith($m)) | .id][0] // empty') || existing=''

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null || true
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null || true
        fi

    - name: Run report
      id: run-report
      if: inputs.run-report == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        CLAIMS_VERSION: ${{ inputs.claims-version }}
        BUNDLE_INPUT: ${{ inputs.run-report-bundle }}
      run: |
        set -uo pipefail

        # Both SHAs come from the event file rather than expression
        # interpolation. They are GitHub-supplied rather than PR-controlled, so
        # this is consistency with the checker step above rather than a
        # boundary of its own — one rule about where event data is read from is
        # easier to keep than two.
        base=$(jq -r '.pull_request.base.sha // ""' "$GITHUB_EVENT_PATH")
        head=$(jq -r '.pull_request.head.sha // ""' "$GITHUB_EVENT_PATH")
        if [ -z "$base" ] || [ -z "$head" ]; then
          echo 'run report: no base/head in the event payload — skipping' >> "$GITHUB_STEP_SUMMARY"
          echo 'rendered=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        bundle="$BUNDLE_INPUT"
        if [ -z "$bundle" ]; then
          slug=$(jq -r '.pull_request.head.ref // ""' "$GITHUB_EVENT_PATH" | tr '/' '-')
          bundle="nullius.runs/${slug}.json"
        fi

        # The JSON form first, because its `version` decides whether the
        # markdown is safe to post at all. A newer kernel than this Action
        # understands must produce NO comment and say which version it was —
        # a partial render of a document whose shape moved is worse than
        # silence, and silence with a reason is not silence.
        json_status=0
        npx -y "@nullius-inverba/claims@${CLAIMS_VERSION}" witness report "${base}..${head}" \
          --bundle "$bundle" --format json > nullius-run-report.json 2> nullius-run-report.err || json_status=$?

        if [ "$json_status" -ne 0 ]; then
          {
            echo '## nullius run report'
            echo
            echo 'Not rendered. The verb exited non-zero, which under its own contract means a'
            echo 'usage error or unreadable input rather than a finding — the report exits 0'
            echo 'whenever it produced anything at all.'
            echo '```'
            cat nullius-run-report.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'rendered=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The run-report document versions this action can render. A SET, not an
        # equality: the action re-invokes a pinned `claims-version`, so a caller
        # holding an older pin produces an older document, and an equality here
        # would stop posting for every one of them the day this action learned a
        # newer one. Version 2 added the `card` key and changed nothing the
        # renderer below depends on, so both are renderable.
        #
        # A version outside the set is still refused rather than guessed at. The
        # cost of guessing is a comment that looks complete and is not.
        ACCEPTED_REPORT_VERSIONS='1 2'

        version=$(jq -r '.version // "absent"' nullius-run-report.json)
        kind=$(jq -r '.kind // "absent"' nullius-run-report.json)
        known=no
        for accepted in $ACCEPTED_REPORT_VERSIONS; do
          if [ "$version" = "$accepted" ]; then known=yes; fi
        done
        if [ "$kind" != 'run-report' ] || [ "$known" != 'yes' ]; then
          {
            echo '## nullius run report'
            echo
            echo "Not posted: this action understands \`run-report\` version(s)"
            echo "\`${ACCEPTED_REPORT_VERSIONS}\`, and the checker produced kind \`${kind}\`"
            echo "version \`${version}\`. Pin \`claims-version\` to a release this action"
            echo 'knows, or upgrade the action.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'rendered=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        npx -y "@nullius-inverba/claims@${CLAIMS_VERSION}" witness report "${base}..${head}" \
          --bundle "$bundle" --format md > nullius-run-report.md 2>/dev/null || true

        {
          echo '## nullius run report'
          echo
          cat nullius-run-report.md
        } >> "$GITHUB_STEP_SUMMARY"

        echo 'rendered=true' >> "$GITHUB_OUTPUT"

    - name: Upload run report
      if: steps.run-report.outputs.rendered == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: nullius-run-report
        path: |
          nullius-run-report.json
          nullius-run-report.md
        if-no-files-found: warn

    - name: Upsert run report comment
      if: >-
        steps.run-report.outputs.rendered == 'true' && inputs.comment == 'true' &&
        inputs.github-token != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail

        # NOT a prefix of `<!-- nullius-claims -->`, and that marker is not a
        # prefix of this one. The upsert below matches by `startswith`, so a
        # marker that prefixed the other would let one comment overwrite the
        # other and the grounding result and the process result would share a
        # slot.
        marker='<!-- nullius-run-report -->'
        body=$(printf '%s\n%s\n' "$marker" "$(cat nullius-run-report.md)")

        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
          | jq -r --arg m "$marker" '[.[] | select(.body | startswith($m)) | .id][0] // empty') || existing=''

        post_status=0
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null || post_status=$?
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null || post_status=$?
        fi

        # The grounding comment above swallows a failed post with `|| true`.
        # This one does not: a report that silently failed to post is
        # indistinguishable from a run that had nothing to report, which is the
        # confusion the whole feature exists to remove. The job still succeeds —
        # a comment is not a gate — but the summary says what happened.
        if [ "$post_status" -ne 0 ]; then
          {
            echo '## nullius run report'
            echo
            echo "The report rendered but the comment could not be posted (exit ${post_status})."
            echo 'The rendered markdown is in this step summary and in the `nullius-run-report` artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Enforce strict mode
      if: inputs.strict == 'true' && steps.check.outputs.status != '0'
      shell: bash
      run: |
        echo 'strict mode: unverified claims fail the job (see report above)'
        exit 1
