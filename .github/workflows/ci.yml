name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A step that hangs otherwise runs to the six-hour job maximum and reports
    # as `cancelled` rather than failed: six hours of billed runner time for a
    # signal nobody can act on, and a red mark that does not say what broke.
    # The job's real cost is about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # This repo's own documents carry rev-stamped anchors, which are
          # settled with `git show` against the commit they name. A shallow
          # clone does not have it, and the gate would quietly fail open.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The flag-arity conformance test checks the allowlists against the real
      # binaries. ubuntu-latest ships grep but not ripgrep, and a skipped check
      # is a green check — so install it rather than lose half the coverage.
      #
      # A pinned tarball rather than `apt-get install ripgrep`: apt resolves
      # through the Azure-local Ubuntu mirror, and when that mirror answers
      # `Ign` it falls back to archive.ubuntu.com, where the transfer can stall
      # with no timeout of its own. Two runs hung there for the full six hours.
      # This path talks only to github.com, pins the version the table is
      # checked against, and verifies the tarball before trusting the binary.
      - name: Install ripgrep
        env:
          RG_VERSION: 15.2.0
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          tarball="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
               --retry 3 --retry-all-errors --max-time 120 \
               --output "$tarball" \
               "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${tarball}"
          echo "${RG_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball"
          sudo install -m 755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$tarball" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm test

      - run: pnpm build

      # The journal validator, dogfooded on a fixture that breaks each of its
      # three invariants: a validator that stops catching them is a validator
      # nobody would notice going quiet.
      - name: nullius witness validate (self)
        run: |
          node packages/claims/dist/cli.js witness validate spec/fixtures/valid-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/broken-run.jsonl
      # Dogfood: the README carries live Evidence Anchors into this repo's own
      # source. If the code drifts out from under the README's claims, this
      # step says so — the tool checking the docs of the tool.
      - name: nullius check (self)
        run: node packages/claims/dist/cli.js check 'README.md' 'spec/**/*.md' --require-markers
