name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A step that hangs otherwise runs to the six-hour job maximum and reports
    # as `cancelled` rather than failed: six hours of billed runner time for a
    # signal nobody can act on, and a red mark that does not say what broke.
    # The job's real cost is about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # This repo's own documents carry rev-stamped anchors, which are
          # settled with `git show` against the commit they name. A shallow
          # clone does not have it, and the gate would quietly fail open.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The flag-arity conformance test checks the allowlists against the real
      # binaries. ubuntu-latest ships grep but not ripgrep, and a skipped check
      # is a green check — so install it rather than lose half the coverage.
      #
      # A pinned tarball rather than `apt-get install ripgrep`: apt resolves
      # through the Azure-local Ubuntu mirror, and when that mirror answers
      # `Ign` it falls back to archive.ubuntu.com, where the transfer can stall
      # with no timeout of its own. Two runs hung there for the full six hours.
      # This path talks only to github.com, pins the version the table is
      # checked against, and verifies the tarball before trusting the binary.
      - name: Install ripgrep
        env:
          RG_VERSION: 15.2.0
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          tarball="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
               --retry 3 --retry-all-errors --max-time 120 \
               --output "$tarball" \
               "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${tarball}"
          echo "${RG_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball"
          sudo install -m 755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$tarball" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - run: pnpm install --frozen-lockfile

      # Build first, and not as a matter of taste. The kit imports the kernel
      # the way any consumer does — by package name — so tsc resolves its types
      # from packages/claims/dist, and vitest resolves validateJournal from the
      # same place at runtime. Neither exists on a fresh checkout until this
      # step runs, so a clean clone cannot type-check or test without it.
      #
      # The upside of leaving it this way rather than pointing the kit at the
      # kernel's source: the kit is checked against what the kernel PUBLISHES,
      # not against its internals. pnpm builds in topological order, so the
      # kernel is ready before the kit compiles against it.
      - run: pnpm build

      - run: pnpm type-check

      - run: pnpm test

      # The journal validator, dogfooded on a fixture that breaks each of its
      # three invariants: a validator that stops catching them is a validator
      # nobody would notice going quiet.
      - name: nullius witness validate (self)
        run: |
          node packages/claims/dist/cli.js witness validate spec/fixtures/valid-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/broken-run.jsonl
          # v0.1 compatibility is a promise, so it is a checked promise: a
          # headerless journal must still validate under the v0.2 build.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.1-run.jsonl
          # And a schema from the future must fail as ONE finding, not a cascade.
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/future-run.jsonl
          # A journal the hook pack actually produced, from a real session with
          # two parallel subagents. The synthetic fixtures are what the schema
          # says; this one is what the harness does.
          node packages/claims/dist/cli.js witness validate spec/fixtures/hooks-run.jsonl
          # v0.3, the run ledger. The valid one exercises all five kinds, both
          # merge outcomes, and a looks-good discharging a dispatch; the broken
          # one trips both new verdicts plus every new malformed and
          # dangling-reference path, including a blocker whose only
          # resolutions are themselves malformed — which must not discharge it.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.3-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.3-broken-run.jsonl
          # The 0.4 compatibility guarantee, checked rather than asserted. This
          # journal carries all three records 0.4 rejects — a `rev: "main"`
          # verification, a `mutation` with `rev`, and `branch: ""` — and
          # declares 0.3, so it must still exit 0. It gets its own line because
          # the unchanged suite would pass with the version predicate written
          # backwards: neither other 0.3 fixture contains a verification or a
          # mutation at all.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.3-compat-run.jsonl
          # The same three records at 0.4, where they ARE rejected. This and the
          # compat journal above are byte-identical apart from the declared
          # version, so the pair is the test: either alone passes with the
          # version predicate written backwards.
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.4-broken-run.jsonl
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.5-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.5-broken-run.jsonl
          # A 0.4 journal carrying all three identity fields and a rev-stamped
          # verification. Exit 0 is also what an empty file scores, so the unit
          # test asserting the fields reach JournalReport.header is what gives
          # this fixture teeth; the line below only pins that it stays valid.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.4-identity-run.jsonl
          # --expect-rules: did every rule rules select named actually reach a
          # delivered verdict in this journal? "Reached a terminal record" is
          # not enough — the broken fixture trips a never-dispatched rule and
          # a no-report terminal, neither of which may silently read as
          # covered. The malformed-record risk (a bad JSON line skipped
          # rather than trusted) is covered by a dedicated unit test
          # (ruleCoverage.test.ts, task 4.4), not this fixture.
          node packages/claims/dist/cli.js witness validate spec/fixtures/rule-coverage-valid.jsonl --expect-rules build-before-cli merge-never-squash one-delivery-mechanism
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/rule-coverage-broken.jsonl --expect-rules build-before-cli verdict-needs-fixture-and-test rev-stamp-change-anchors model-proposes-code-verifies
      # The producer, end to end and under contention. Hook payloads in,
      # journal out, validator's verdict on it — and the parallel case is the
      # one that matters: several subagent hooks append to one file at once,
      # and a half-written line is the single failure a journal cannot
      # survive. A unit test cannot prove this; concurrent processes can.
      - name: nullius witness record (round trip, parallel)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          kit="node packages/kit/dist/cli.js"
          for i in $(seq 1 12); do
            printf '{"session_id":"ci","hook_event_name":"PreToolUse","tool_name":"Task","tool_use_id":"t%s","tool_input":{"description":"probe %s"}}' "$i" "$i" \
              | $kit witness record --root "$work" 2>> "$work/notes.log" &
          done
          wait
          printf '{"session_id":"ci","hook_event_name":"SessionEnd","reason":"clear"}' \
            | $kit witness record --root "$work" 2>> "$work/notes.log"
          journal="$work/.nullius/runs/ci.jsonl"

          # A refused append is a legitimate outcome under contention — the
          # writer drops the record rather than mangle the file. But it makes
          # the journal short, and a bare count assertion would then read as a
          # correlation bug and send a maintainer into record.ts. Name it.
          if grep -q "holds the lock" "$work/notes.log"; then
            echo "A writer was refused the append lock, so this journal is short by design:" >&2
            cat "$work/notes.log" >&2
            exit 1
          fi

          lines=$(wc -l < "$journal")
          if [ "$lines" -ne 25 ]; then   # header + 12 dispatches + 12 sealed terminals
            echo "expected 25 records, got $lines — with no lock refusal to explain it" >&2
            cat "$journal" >&2
            exit 1
          fi
          while read -r line; do node -e 'JSON.parse(process.argv[1])' "$line"; done < "$journal"
          node packages/claims/dist/cli.js witness validate "$journal"

      # Dogfood: the specs carry live Evidence Anchors into this repo's own
      # source. If the code drifts out from under their claims, this step says
      # so — the tool checking the docs of the tool.
      #
      # README.md is deliberately NOT here. It is the front door: an explanation
      # of the convention rather than an assertion about the code, and it shows
      # the anchor grammar in fenced examples that the parser (correctly) ignores.
      # With no anchors of its own, --require-markers would fail it for being
      # what it is.
      - name: nullius check (self)
        run: |
          node packages/claims/dist/cli.js check 'spec/**/*.md' --require-markers
          # Change proposals cite code they are ABOUT TO MODIFY, so they rot in
          # a way the spec does not: a design doc that quotes a line as the
          # reason to delete it is FABRICATED the moment the change lands. That
          # is what rev-stamps are for, and this is what makes anyone use them.
          # No --require-markers: a tasks.md asserts nothing about the code and
          # should not be forced to carry an anchor.
          node packages/claims/dist/cli.js check 'openspec/**/*.md'

      # The canary, dogfooded through its whole lifecycle. There is no static
      # fixture for CANARY-PRESENT and there cannot be one: the registry lives
      # outside the document on purpose, because an in-doc marker would tip off
      # the reviewer layer the probe exists to measure. So the gate is the
      # round trip, and it asserts the two directions that matter — the guard
      # FIRES on a planted document, and `verify` scores a report that ignored
      # the plant as MISSED rather than passing it.
      - name: nullius canary (self)
        run: |
          set -euo pipefail
          printf '# Probe\n\nThe retry budget is shared across workers.\n' > .canary-probe.md
          node packages/claims/dist/cli.js canary plant .canary-probe.md
          # The guard must fail an otherwise-clean document.
          ! node packages/claims/dist/cli.js check '.canary-probe.md'
          # ...and --probing must be the only thing that lets it through.
          node packages/claims/dist/cli.js check '.canary-probe.md' --probing
          # A review that said nothing is MISSED (exit 1), never a pass.
          printf 'Looks fine.\n' > .canary-report.md
          ! node packages/claims/dist/cli.js canary verify .canary-report.md
          node packages/claims/dist/cli.js canary clear
          node packages/claims/dist/cli.js canary status
          rm -f .canary-probe.md .canary-report.md

      # The wiring check, dogfooded on both fixtures and on this repo's own
      # harness tree. A routing row naming an agent that does not exist is the
      # one review failure that reports success, so the broken fixture must
      # keep failing; the unit test asserts WHICH verdicts fire, because the
      # exit code here stays 1 even when one of them goes quiet.
      - name: nullius wiring (self)
        run: |
          node packages/claims/dist/cli.js wiring spec/fixtures/wiring-valid
          ! node packages/claims/dist/cli.js wiring spec/fixtures/wiring-broken
          node packages/claims/dist/cli.js wiring

      # The rules check, dogfooded on both fixtures and on this repo's own
      # .claude/rules/ tree. A malformed rule header must keep failing; the
      # unit tests (rules.test.ts, rulesScan.test.ts) assert WHICH verdicts
      # fire, because the exit code here stays 1 even when one of them goes
      # quiet. `ungrounded-rule` and `rule-rot` are advisory by design and
      # do not fail this step even on the real tree.
      - name: nullius rules (self)
        run: |
          node packages/claims/dist/cli.js rules check spec/fixtures/rules-valid
          ! node packages/claims/dist/cli.js rules check spec/fixtures/rules-broken
          node packages/claims/dist/cli.js rules check

      # The oracle verb, both polarities.
      #
      # Read the limits before trusting this step:
      #
      # 1. The negated arm gates MALFORMED-JUSTIFICATION ONLY.
      #    UNJUSTIFIED-ORACLE-CHANGE is advisory in v1 and exits 0, so it is
      #    asserted by name in oracle.test.ts and NOT here. A regression that
      #    silenced it alone would leave this step green.
      #
      # 2. The arm asserts on OUTPUT as well as exit code, deliberately. An
      #    absent `oracles` key also exits non-zero, so a bare `!` would be
      #    satisfied identically by "the verdict fired" and by "nothing is
      #    configured" — a gate that passes for the wrong reason, which is the
      #    exact defect .claude/rules/verdict-needs-fixture-and-test.md names.
      #    Hence --config, pointing at a fixture where oracles IS declared.
      #
      # 3. The exit-code and output assertions are SEPARATE statements.
      #    `! cmd | grep -q X` negates the pipeline rather than the command and
      #    inverts the assertion.
      #
      # 4. The arm pins the human format. Every renderer prints
      #    verdict.toUpperCase(), so the token is a de facto contract — but a
      #    future --format json would render it lowercase and the grep would
      #    stop matching silently.
      #
      # The range is empty (base == head) on purpose: MALFORMED-JUSTIFICATION is
      # read from the journal, not the diff, so it needs no commit history and
      # this fixture needs no .git directory.
      - name: nullius oracle (self)
        run: |
          node packages/claims/dist/cli.js oracle HEAD..HEAD \
            --config spec/fixtures/oracle-valid/nullius.config.json \
            --journal spec/fixtures/oracle-valid/run.jsonl
          ! node packages/claims/dist/cli.js oracle HEAD..HEAD \
            --config spec/fixtures/oracle-broken/nullius.config.json \
            --journal spec/fixtures/oracle-broken/run.jsonl
          node packages/claims/dist/cli.js oracle HEAD..HEAD \
            --config spec/fixtures/oracle-broken/nullius.config.json \
            --journal spec/fixtures/oracle-broken/run.jsonl 2>&1 \
            | grep -q 'MALFORMED-JUSTIFICATION'
          # An unconfigured project must report, never reassure.
          ! node packages/claims/dist/cli.js oracle HEAD..HEAD
          node packages/claims/dist/cli.js oracle HEAD..HEAD 2>&1 \
            | grep -q 'no `oracles` declared'
          # A real three-dot range against this repository's own history.
          # HEAD..HEAD cannot see the separator at all — merge-base(HEAD,HEAD)
          # is HEAD — so every arm above is blind to the defect where `diff()`
          # ignored `sep` and ran `..` for both. This arm consumes the `...`
          # path end to end and must exit 0 rather than 2, which is also a
          # standing check that merge-base resolution works in a CI checkout.
          node packages/claims/dist/cli.js oracle "$(git rev-parse HEAD)...HEAD" \
            --config spec/fixtures/oracle-valid/nullius.config.json \
            --journal spec/fixtures/oracle-valid/run.jsonl
