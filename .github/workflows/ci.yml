name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A step that hangs otherwise runs to the six-hour job maximum and reports
    # as `cancelled` rather than failed: six hours of billed runner time for a
    # signal nobody can act on, and a red mark that does not say what broke.
    # The job's real cost is about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # This repo's own documents carry rev-stamped anchors, which are
          # settled with `git show` against the commit they name. A shallow
          # clone does not have it, and the gate would quietly fail open.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The flag-arity conformance test checks the allowlists against the real
      # binaries. ubuntu-latest ships grep but not ripgrep, and a skipped check
      # is a green check — so install it rather than lose half the coverage.
      #
      # A pinned tarball rather than `apt-get install ripgrep`: apt resolves
      # through the Azure-local Ubuntu mirror, and when that mirror answers
      # `Ign` it falls back to archive.ubuntu.com, where the transfer can stall
      # with no timeout of its own. Two runs hung there for the full six hours.
      # This path talks only to github.com, pins the version the table is
      # checked against, and verifies the tarball before trusting the binary.
      - name: Install ripgrep
        env:
          RG_VERSION: 15.2.0
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          tarball="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
               --retry 3 --retry-all-errors --max-time 120 \
               --output "$tarball" \
               "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${tarball}"
          echo "${RG_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball"
          sudo install -m 755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$tarball" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - run: pnpm install --frozen-lockfile

      # Build first, and not as a matter of taste. The kit imports the kernel
      # the way any consumer does — by package name — so tsc resolves its types
      # from packages/claims/dist, and vitest resolves validateJournal from the
      # same place at runtime. Neither exists on a fresh checkout until this
      # step runs, so a clean clone cannot type-check or test without it.
      #
      # The upside of leaving it this way rather than pointing the kit at the
      # kernel's source: the kit is checked against what the kernel PUBLISHES,
      # not against its internals. pnpm builds in topological order, so the
      # kernel is ready before the kit compiles against it.
      - run: pnpm build

      - run: pnpm type-check

      - run: pnpm test

      # The journal validator, dogfooded on a fixture that breaks each of its
      # three invariants: a validator that stops catching them is a validator
      # nobody would notice going quiet.
      - name: nullius witness validate (self)
        run: |
          node packages/claims/dist/cli.js witness validate spec/fixtures/valid-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/broken-run.jsonl
          # v0.1 compatibility is a promise, so it is a checked promise: a
          # headerless journal must still validate under the v0.2 build.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.1-run.jsonl
          # And a schema from the future must fail as ONE finding, not a cascade.
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/future-run.jsonl
          # A journal the hook pack actually produced, from a real session with
          # two parallel subagents. The synthetic fixtures are what the schema
          # says; this one is what the harness does.
          node packages/claims/dist/cli.js witness validate spec/fixtures/hooks-run.jsonl
          # v0.3, the run ledger. The valid one exercises all five kinds, both
          # merge outcomes, and a looks-good discharging a dispatch; the broken
          # one trips both new verdicts plus every new malformed and
          # dangling-reference path, including a blocker whose only
          # resolutions are themselves malformed — which must not discharge it.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.3-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.3-broken-run.jsonl
          # The 0.4 compatibility guarantee, checked rather than asserted. This
          # journal carries all three records 0.4 rejects — a `rev: "main"`
          # verification, a `mutation` with `rev`, and `branch: ""` — and
          # declares 0.3, so it must still exit 0. It gets its own line because
          # the unchanged suite would pass with the version predicate written
          # backwards: neither other 0.3 fixture contains a verification or a
          # mutation at all.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.3-compat-run.jsonl
          # The same three records at 0.4, where they ARE rejected. This and the
          # compat journal above are byte-identical apart from the declared
          # version, so the pair is the test: either alone passes with the
          # version predicate written backwards.
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.4-broken-run.jsonl
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.5-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.5-broken-run.jsonl
          # v0.6, the run-ledger producer. The valid one carries a `prompt`, a
          # `user.name` header, per-record `origin` on all four coordinator
          # kinds, an `expects: "findings"` dispatch a finding answers, and a
          # dispatch WITHOUT `expects` whose terminal is `found` and which no
          # finding names — the loosening, which must not trip SILENT-REVIEWER
          # here. The broken one trips all seven new rejections, one each.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.6-run.jsonl
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.6-broken-run.jsonl
          # The compatibility twin, and note the `!`: this pair is INVERTED
          # relative to the v0.3-compat one above. That bump TIGHTENED, so its
          # twin passes at the older version — same bytes, older version, still
          # valid. 0.6 LOOSENS SILENT-REVIEWER, so the direction flips: the same
          # records must pass at 0.6 and FAIL at 0.5. A pair where both halves
          # pass, or both fail, proves nothing about which way the floor points.
          #
          # And the exit code alone does not isolate the loosening: this journal
          # fails at 0.5 for two independent reasons — the unscoped
          # SILENT-REVIEWER on the dispatch without `expects`, and `prompt`
          # being an unknown kind before 0.6 — and a `1` cannot say which fired.
          # The "fires unscoped at 0.5" unit test in witness.test.ts is what
          # pins the predicate's direction; this line only pins that the twin
          # does not silently start passing.
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/v0.5-compat-run.jsonl
          # A 0.4 journal carrying all three identity fields and a rev-stamped
          # verification. Exit 0 is also what an empty file scores, so the unit
          # test asserting the fields reach JournalReport.header is what gives
          # this fixture teeth; the line below only pins that it stays valid.
          node packages/claims/dist/cli.js witness validate spec/fixtures/v0.4-identity-run.jsonl
          # --expect-rules: did every rule rules select named actually reach a
          # delivered verdict in this journal? "Reached a terminal record" is
          # not enough — the broken fixture trips a never-dispatched rule and
          # a no-report terminal, neither of which may silently read as
          # covered. The malformed-record risk (a bad JSON line skipped
          # rather than trusted) is covered by a dedicated unit test
          # (ruleCoverage.test.ts, task 4.4), not this fixture.
          node packages/claims/dist/cli.js witness validate spec/fixtures/rule-coverage-valid.jsonl --expect-rules build-before-cli merge-never-squash one-delivery-mechanism
          ! node packages/claims/dist/cli.js witness validate spec/fixtures/rule-coverage-broken.jsonl --expect-rules build-before-cli verdict-needs-fixture-and-test rev-stamp-change-anchors model-proposes-code-verifies
      # The producer, end to end and under contention. Hook payloads in,
      # journal out, validator's verdict on it — and the parallel case is the
      # one that matters: several subagent hooks append to one file at once,
      # and a half-written line is the single failure a journal cannot
      # survive. A unit test cannot prove this; concurrent processes can.
      - name: nullius witness record (round trip, parallel)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          kit="node packages/kit/dist/cli.js"
          for i in $(seq 1 12); do
            printf '{"session_id":"ci","hook_event_name":"PreToolUse","tool_name":"Task","tool_use_id":"t%s","tool_input":{"description":"probe %s"}}' "$i" "$i" \
              | $kit witness record --root "$work" 2>> "$work/notes.log" &
          done
          wait
          printf '{"session_id":"ci","hook_event_name":"SessionEnd","reason":"clear"}' \
            | $kit witness record --root "$work" 2>> "$work/notes.log"
          journal="$work/.nullius/runs/ci.jsonl"

          # A refused append is a legitimate outcome under contention — the
          # writer drops the record rather than mangle the file. But it makes
          # the journal short, and a bare count assertion would then read as a
          # correlation bug and send a maintainer into record.ts. Name it.
          if grep -q "holds the lock" "$work/notes.log"; then
            echo "A writer was refused the append lock, so this journal is short by design:" >&2
            cat "$work/notes.log" >&2
            exit 1
          fi

          lines=$(wc -l < "$journal")
          if [ "$lines" -ne 25 ]; then   # header + 12 dispatches + 12 sealed terminals
            echo "expected 25 records, got $lines — with no lock refusal to explain it" >&2
            cat "$journal" >&2
            exit 1
          fi
          while read -r line; do node -e 'JSON.parse(process.argv[1])' "$line"; done < "$journal"
          node packages/claims/dist/cli.js witness validate "$journal"

      # The producer's other half, and the two tiers meeting in one file. The
      # step above proves the harness-attested records survive contention; this
      # one proves the coordinator's records join to them and that the verdict
      # which compares the tiers still fires.
      #
      # A SIBLING STEP rather than more lines in the one above, because that
      # step asserts an exact journal line count (25) as its correlation check.
      # Appending ledger records to the same journal would move that number and
      # make the count assertion a thing maintained rather than a thing
      # believed. This journal is its own, in its own temp root.
      #
      # BOTH POLARITIES, and the negative one is the point. The happy path here
      # is "a coordinator answered a blocker and the journal validates" — which
      # is also what a retired SUPPRESSED-FINDING produces. So the journal is
      # validated FIRST with the blocker unanswered and must fail, by exit code
      # and by name. Without that arm the whole step would stay green on a
      # verdict that had gone quiet, which is the defect
      # .claude/rules/verdict-needs-fixture-and-test.md is about.
      - name: nullius witness ledger (round trip, both polarities)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          kit="node packages/kit/dist/cli.js"
          journal="$work/.nullius/runs/ledger.jsonl"

          # A dispatch, then a synchronous terminal whose return text carries
          # the tag grammar. The `finding` records are EXTRACTED by the
          # recorder from what the agent returned — nothing below writes one,
          # and `witness ledger` refuses the kind — so the blocker the
          # resolution answers belongs to the harness tier.
          printf '{"session_id":"ledger","hook_event_name":"PreToolUse","tool_name":"Task","tool_use_id":"t1","tool_input":{"subagent_type":"rule-auditor","description":"audit the diff"}}' \
            | $kit witness record --root "$work"
          printf '{"session_id":"ledger","hook_event_name":"PostToolUse","tool_name":"Task","tool_use_id":"t1","tool_input":{"subagent_type":"rule-auditor"},"tool_response":{"content":[{"type":"text","text":"- [blocker] the anchor is unstamped\\n- [looks-good] the rest holds"}]}}' \
            | $kit witness record --root "$work"

          # No resolution yet: the blocker is unanswered and the journal must
          # not validate. Exit code and output are SEPARATE statements — an
          # unreadable journal also exits non-zero, so a bare `!` would be
          # satisfied identically by "the verdict fired" and by "the file was
          # not there". The output arm is a redirect rather than a pipe:
          # `! cmd | grep -q X` negates the pipeline instead of the command.
          ! node packages/claims/dist/cli.js witness validate "$journal"
          node packages/claims/dist/cli.js witness validate "$journal" > "$work/unanswered.log" 2>&1 || true
          grep -q 'SUPPRESSED-FINDING' "$work/unanswered.log"

          # The id comes from the journal, never from the coordinator's memory
          # of what it dispatched — that is the whole reason the subcommand
          # exists. An empty result would silently make the resolution below
          # name nothing, so it is asserted rather than assumed.
          finding=$($kit witness ledger findings --open --session ledger --root "$work" | cut -f1)
          test -n "$finding"

          $kit witness ledger stage --phase verify --iteration 1 --change ci-round-trip --session ledger --root "$work"
          $kit witness ledger check --command 'pnpm test' --outcome pass --text 'every suite green' --counts 'failures=0' --session ledger --root "$work"
          $kit witness ledger resolution --finding "$finding" --outcome fixed --text 'the anchor was stamped and re-read' --session ledger --root "$work"

          node packages/claims/dist/cli.js witness validate "$journal" > "$work/answered.log" 2>&1
          cat "$work/answered.log"
          # And the three records land in the SELF-REPORTED tier. Exit 0 alone
          # would be satisfied by a build that wrote them with the header's
          # `hooks` origin — a coordinator's account of its own run laundered
          # as harness attestation, which is the one claim it is least entitled
          # to make. The provenance line is where that is visible.
          grep -q '3 self-reported' "$work/answered.log"

      # Dogfood: the specs carry live Evidence Anchors into this repo's own
      # source. If the code drifts out from under their claims, this step says
      # so — the tool checking the docs of the tool.
      #
      # README.md is deliberately NOT here. It is the front door: an explanation
      # of the convention rather than an assertion about the code, and it shows
      # the anchor grammar in fenced examples that the parser (correctly) ignores.
      # With no anchors of its own, --require-markers would fail it for being
      # what it is.
      - name: nullius check (self)
        run: |
          node packages/claims/dist/cli.js check 'spec/**/*.md' --require-markers
          # Change proposals cite code they are ABOUT TO MODIFY, so they rot in
          # a way the spec does not: a design doc that quotes a line as the
          # reason to delete it is FABRICATED the moment the change lands. That
          # is what rev-stamps are for, and this is what makes anyone use them.
          # No --require-markers: a tasks.md asserts nothing about the code and
          # should not be forced to carry an anchor.
          node packages/claims/dist/cli.js check 'openspec/**/*.md'

      # `witness report` over this repository's own history, both polarities of
      # the bundle.
      #
      # The range is the one PR #58 landed on, and the envelopes under
      # spec/fixtures/report/ were produced by the real `witness bundle` over
      # it — so this step exercises the join the feature exists for rather than
      # a synthesised stand-in.
      #
      # EVERY ASSERTION HERE IS A `grep`, not an exit code. The verb's contract
      # is that it exits 0 whenever it produced a report, so its exit code
      # carries one bit and that bit is "the process ran". A step that only
      # checked `$?` would stay green on a build whose every tier had gone
      # silent, which is the defect .claude/rules/verdict-needs-fixture-and-test.md
      # is about, in the one place where the exit code CANNOT be the gate.
      - name: nullius grounding card (self, and the adversarial fixture)
        run: |
          set -euo pipefail
          fixtures=spec/fixtures/card

          # The card over this repository's own openspec documents. The verb
          # renders and the gate is separate, so a failing anchor here would
          # still produce a card — assert the card exists, not that it is green.
          node packages/claims/dist/cli.js check 'openspec/**/*.md' --format card > /tmp/card.md || true
          grep -q '^## nullius claims check' /tmp/card.md
          grep -q '| anchors checked |' /tmp/card.md
          # The modesty line is load-bearing: a tidy green table reads as a
          # stronger claim than the prose it replaces.
          grep -q 'certifies the citation and not the argument' /tmp/card.md
          grep -q 'audit' /tmp/card.md

          # BOTH arms. A bare negative grep passes vacuously the day a heading
          # is renamed, which is the failure verdict-needs-fixture-and-test
          # describes.
          node packages/claims/dist/cli.js check 'README.md' --format card > /tmp/card-zero.md || true
          grep -q '| anchors checked | 0 presence' /tmp/card-zero.md
          ! grep -qE '^\| failures \| [1-9]' /tmp/card-zero.md

          # The workflow-command escaper, over the adversarial fixture. This is
          # the half of the escaping that lives in the Action rather than in the
          # kernel, so this is where its assertion lives. A `::` surviving into
          # a value would close the annotation and let PR-controlled text run as
          # a new workflow command.
          jq -r '
            def msg: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub("::"; "%3A%3A");
            def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
            .documents[]?.results[]?
            | select(.failing) | select(.verdict != "canary-present")
            | select((.source.doc // "") != "")
            | "::error file=\(.source.doc | prop),line=\(.source.line)::\(.detail // "" | msg)"
          ' "$fixtures/adversarial-report.json" > /tmp/annotations.txt

          # Exactly one annotation: the canary result is skipped by verdict, and
          # every emitted line is a single line that cannot open a second
          # command from inside its own message.
          test "$(wc -l < /tmp/annotations.txt)" -eq 1
          ! grep -qE '::.*::.*::' /tmp/annotations.txt
          grep -q '%3A%3A' /tmp/annotations.txt

          # And the canary's location never reaches either surface.
          node packages/claims/dist/cli.js check 'openspec/**/*.md' --format card 2>/dev/null | grep -qv '4242' || true
          ! grep -q '4242' /tmp/annotations.txt

      - name: nullius witness report (self, both polarities of the bundle)
        run: |
          set -euo pipefail
          fixtures=spec/fixtures/report
          range='8211685..f431193'
          # --config is passed EXPLICITLY on every invocation below, pointing at
          # a committed fixture, so this step does not inherit whatever
          # `nullius.config.json` happens to sit in the repository root.
          #
          # Without it the step's result depended on repository state it does
          # not control. Running `nullius-kit init` here — the product's own
          # onboarding command — writes a root config narrowing `docs` to
          # `openspec/**/*.md`; every openspec document in this historical range
          # has since been ARCHIVED, so `reportDocuments` correctly drops them as
          # non-existent, the check tier correctly renders `not recorded`, and
          # `.check` is correctly null. The product was right and the assertion
          # below was wrong to assume otherwise.
          #
          # A CI step whose subject is a fixed historical range must pin every
          # input that decides its output. The range is pinned; so is the bundle;
          # the config was not.
          work=$(mktemp -d)

          node packages/claims/dist/cli.js witness report "$range" --config "$fixtures/report.config.json" --bundle "$fixtures/pr58-bundle.json" --format md > "$work/with.md"
          grep -q '^## Code-verified' "$work/with.md"
          grep -q '^## Hook-attested' "$work/with.md"
          grep -q '^## Self-reported' "$work/with.md"
          grep -q '^## Unattributed' "$work/with.md"
          grep -q '^```mermaid' "$work/with.md"
          # The bundled journal is version 0.2, so the tier breakdown is an
          # ABSENCE. Both arms: the sentence is present AND no count was
          # printed. A build that rendered `— 0` here would satisfy the first
          # arm alone, and rendering absence as zero is the whole feature.
          grep -q 'tier breakdown not recorded' "$work/with.md"
          # BOTH arms, and the positive one first. A bare negative grep passes
          # vacuously the day the heading is renamed — the assertion stops
          # asserting without going red, which is the exact failure
          # .claude/rules/verdict-needs-fixture-and-test.md describes. Assert
          # the heading EXISTS, then that it carries no count.
          grep -q '^### Records attributed to the harness' "$work/with.md"
          ! grep -qE '^### Records attributed to the harness — [0-9]' "$work/with.md"

          # No bundle. The contributor-independent tier is unaffected — which is
          # why it is rendered first — and the three bundle tiers name the path
          # that held nothing rather than reporting zero.
          node packages/claims/dist/cli.js witness report "$range" --config "$fixtures/report.config.json" --bundle "$fixtures/absent.json" --format md > "$work/without.md"
          grep -q '^## Code-verified' "$work/without.md"
          grep -q "no bundle at $fixtures/absent.json" "$work/without.md"

          # The JSON form. This arm depends on the exit-code contract: under any
          # other contract it would fail exactly when the report had something
          # to report.
          node packages/claims/dist/cli.js witness report "$range" --config "$fixtures/report.config.json" --bundle "$fixtures/pr58-bundle.json" --format json > "$work/report.json"
          test "$(jq -r .kind "$work/report.json")" = 'run-report'
          # The version this build produces, read from the source of truth
          # rather than pinned here. This assertion was pinned to `1` and went
          # red the day the card raised it to 2 — the third place the number
          # lives, after the constant itself and the Action's accepted set, and
          # the second one to be found by breaking rather than by a test.
          expected_version=$(grep -oE 'RUN_REPORT_VERSION = [0-9]+' packages/claims/src/witnessReport.ts | grep -oE '[0-9]+')
          test -n "$expected_version"
          test "$(jq -r .version "$work/report.json")" = "$expected_version"
          # The embedded check document carries ITS OWN version and has no
          # `kind` of its own — the two documents are told apart by the outer
          # discriminator and by the key, never by their matching version.
          test "$(jq -r .check.version "$work/report.json")" = '1'
          test "$(jq -r '.check.kind // "absent"' "$work/report.json")" = 'absent'

          # A tampered envelope — a journal one terminal record short, which
          # `witness bundle` cannot produce. The hook-attested tier is replaced
          # by the validator's finding and NO dispatch count is printed. The
          # absence of the number is the assertion: `grep -q NO-TERMINAL` alone
          # would stay green on a build that printed the finding and the count.
          node packages/claims/dist/cli.js witness report "$range" --config "$fixtures/report.config.json" --bundle "$fixtures/tampered-bundle.json" --format md > "$work/tampered.md"
          grep -q 'NO-TERMINAL' "$work/tampered.md"
          # Same pairing. The heading must be present in the with-bundle render —
          # which is where a count legitimately appears — so a rename breaks a
          # positive assertion rather than silently satisfying a negative one.
          grep -qE '^### Dispatches — [0-9]' "$work/with.md"
          ! grep -qE '^### Dispatches — [0-9]' "$work/tampered.md"

      # The canary, dogfooded through its whole lifecycle. There is no static
      # fixture for CANARY-PRESENT and there cannot be one: the registry lives
      # outside the document on purpose, because an in-doc marker would tip off
      # the reviewer layer the probe exists to measure. So the gate is the
      # round trip, and it asserts the two directions that matter — the guard
      # FIRES on a planted document, and `verify` scores a report that ignored
      # the plant as MISSED rather than passing it.
      - name: nullius canary (self)
        run: |
          set -euo pipefail
          printf '# Probe\n\nThe retry budget is shared across workers.\n' > .canary-probe.md
          node packages/claims/dist/cli.js canary plant .canary-probe.md
          # The guard must fail an otherwise-clean document.
          ! node packages/claims/dist/cli.js check '.canary-probe.md'
          # ...and --probing must be the only thing that lets it through.
          node packages/claims/dist/cli.js check '.canary-probe.md' --probing
          # A review that said nothing is MISSED (exit 1), never a pass.
          printf 'Looks fine.\n' > .canary-report.md
          ! node packages/claims/dist/cli.js canary verify .canary-report.md
          node packages/claims/dist/cli.js canary clear
          node packages/claims/dist/cli.js canary status
          rm -f .canary-probe.md .canary-report.md

      # The wiring check, dogfooded on both fixtures and on this repo's own
      # harness tree. A routing row naming an agent that does not exist is the
      # one review failure that reports success, so the broken fixture must
      # keep failing; the unit test asserts WHICH verdicts fire, because the
      # exit code here stays 1 even when one of them goes quiet.
      # The stamp fail-open, both polarities. Neither half alone is a gate:
      # asserting only the failure would pass if the checker started accusing
      # everyone, and asserting only the shallow case would pass if the bypass
      # came back. The document is identical in both runs; only the clone
      # differs, which is the whole claim this fix makes.
      - name: nullius check (stamp fail-open, both polarities)
        run: |
          # Full history — the invented stamps must not excuse the fabrications.
          ! node packages/claims/dist/cli.js check spec/fixtures/.stamp-failopen/forged.md

          # Same document, shallow clone — must still refuse to accuse.
          # Cloned from this checkout, so it needs no network and pins nothing.
          git clone --quiet --depth 1 "file://$GITHUB_WORKSPACE" /tmp/shallow-probe
          test "$(git -C /tmp/shallow-probe rev-parse --is-shallow-repository)" = "true"
          cp spec/fixtures/.stamp-failopen/forged.md /tmp/shallow-probe/forged.md
          ( cd /tmp/shallow-probe && node "$GITHUB_WORKSPACE/packages/claims/dist/cli.js" check forged.md )

      # An absent commit must mean the same thing at any hash length (#70).
      # Both must pass: the short one alone would survive a fix that accused
      # only long hashes, the long one alone would survive a checker that
      # verified nothing. The pair is the assertion.
      - name: nullius check (absent commit, hash length invariance)
        run: |
          node packages/claims/dist/cli.js check spec/fixtures/.rev-lane/short-sha.md
          node packages/claims/dist/cli.js check spec/fixtures/.rev-lane/long-sha.md

      # The git lane must answer to the same root as the working-tree lane
      # (#71). Built inline rather than committed, because the defect is about
      # a repository SHAPE — a checked root below the repository top — which a
      # file in this tree cannot express.
      - name: nullius check (git lane confinement)
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          git init -q -b main "$probe"
          git -C "$probe" config user.email ci@example.com
          git -C "$probe" config user.name CI
          printf 'SECRET_TOKEN=hunter2\n' > "$probe/above.txt"
          mkdir -p "$probe/sub"
          printf 'ok\n' > "$probe/sub/local.txt"
          git -C "$probe" add .
          git -C "$probe" commit -qm first
          rev=$(git -C "$probe" rev-parse --short HEAD)

          # Cites a file ABOVE the directory the checker is pointed at, with no
          # `..` in the path — so the path guard sees nothing wrong.
          printf '**Evidence:** `above.txt:1@%s` — `SECRET_TOKEN=hunter2`\n' "$rev" \
            > "$probe/sub/escape.md"
          # Cites a file the checker legitimately can reach, so a lane that is
          # merely broken fails this too.
          printf '**Evidence:** `local.txt:1@%s` — `ok`\n' "$rev" \
            > "$probe/sub/local.md"

          cd "$probe/sub"
          ! node "$GITHUB_WORKSPACE/packages/claims/dist/cli.js" check escape.md
          node "$GITHUB_WORKSPACE/packages/claims/dist/cli.js" check local.md

      - name: nullius wiring (self)
        run: |
          node packages/claims/dist/cli.js wiring spec/fixtures/wiring-valid
          ! node packages/claims/dist/cli.js wiring spec/fixtures/wiring-broken
          node packages/claims/dist/cli.js wiring

      # The rules check, dogfooded on both fixtures and on this repo's own
      # .claude/rules/ tree. A malformed rule header must keep failing; the
      # unit tests (rules.test.ts, rulesScan.test.ts) assert WHICH verdicts
      # fire, because the exit code here stays 1 even when one of them goes
      # quiet. `ungrounded-rule` and `rule-rot` are advisory by design and
      # do not fail this step even on the real tree.
      - name: nullius rules (self)
        run: |
          node packages/claims/dist/cli.js rules check spec/fixtures/rules-valid
          ! node packages/claims/dist/cli.js rules check spec/fixtures/rules-broken
          node packages/claims/dist/cli.js rules check

      # The oracle verb, both polarities.
      #
      # Read the limits before trusting this step:
      #
      # 1. The negated arm gates MALFORMED-JUSTIFICATION ONLY.
      #    UNJUSTIFIED-ORACLE-CHANGE is advisory in v1 and exits 0, so it is
      #    asserted by name in oracle.test.ts and NOT here. A regression that
      #    silenced it alone would leave this step green.
      #
      # 2. The arm asserts on OUTPUT as well as exit code, deliberately. An
      #    absent `oracles` key also exits non-zero, so a bare `!` would be
      #    satisfied identically by "the verdict fired" and by "nothing is
      #    configured" — a gate that passes for the wrong reason, which is the
      #    exact defect .claude/rules/verdict-needs-fixture-and-test.md names.
      #    Hence --config, pointing at a fixture where oracles IS declared.
      #
      # 3. The exit-code and output assertions are SEPARATE statements.
      #    `! cmd | grep -q X` negates the pipeline rather than the command and
      #    inverts the assertion.
      #
      # 4. The arm pins the human format. Every renderer prints
      #    verdict.toUpperCase(), so the token is a de facto contract — but a
      #    future --format json would render it lowercase and the grep would
      #    stop matching silently.
      #
      # The range is empty (base == head) on purpose: MALFORMED-JUSTIFICATION is
      # read from the journal, not the diff, so it needs no commit history and
      # this fixture needs no .git directory.
      - name: nullius oracle (self)
        run: |
          node packages/claims/dist/cli.js oracle HEAD..HEAD \
            --config spec/fixtures/oracle-valid/nullius.config.json \
            --journal spec/fixtures/oracle-valid/run.jsonl
          ! node packages/claims/dist/cli.js oracle HEAD..HEAD \
            --config spec/fixtures/oracle-broken/nullius.config.json \
            --journal spec/fixtures/oracle-broken/run.jsonl
          node packages/claims/dist/cli.js oracle HEAD..HEAD \
            --config spec/fixtures/oracle-broken/nullius.config.json \
            --journal spec/fixtures/oracle-broken/run.jsonl 2>&1 \
            | grep -q 'MALFORMED-JUSTIFICATION'
          # An unconfigured project must report, never reassure.
          ! node packages/claims/dist/cli.js oracle HEAD..HEAD
          node packages/claims/dist/cli.js oracle HEAD..HEAD 2>&1 \
            | grep -q 'no `oracles` declared'
          # A real three-dot range against this repository's own history.
          # HEAD..HEAD cannot see the separator at all — merge-base(HEAD,HEAD)
          # is HEAD — so every arm above is blind to the defect where `diff()`
          # ignored `sep` and ran `..` for both. This arm consumes the `...`
          # path end to end and must exit 0 rather than 2, which is also a
          # standing check that merge-base resolution works in a CI checkout.
          node packages/claims/dist/cli.js oracle "$(git rev-parse HEAD)...HEAD" \
            --config spec/fixtures/oracle-valid/nullius.config.json \
            --journal spec/fixtures/oracle-valid/run.jsonl
