# .github/workflows/claims.yml — generated by `nullius-kit init`, then
# CORRECTED. `doctor --fix` would overwrite the two corrections below; see the
# comment on `globs` before running it.

name: claims
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git show <rev>:<path>` needs the commit an anchor names. Without
          # this, every rev-stamped anchor degrades to the advisory
          # UNVERIFIABLE-REV and the gate silently stops gating.
          fetch-depth: 0
      - uses: armanfatemi/nullius/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # DIVERGES FROM THE `specs` PROFILE, deliberately.
          #
          # The profile pairs `openspec/**/*.md` with `require-markers: true`,
          # and on this repository that is red on arrival: 73 of 125 openspec
          # documents are task lists, progress files and spec deltas that carry
          # no anchors and should not. Requiring markers there would either fail
          # every pull request or push authors to add citations that cite
          # nothing.
          #
          # What this repository has actually enforced in ci.yml for months is
          # narrower and is what is reproduced here: check BOTH document trees,
          # and require markers in neither. `strict: true` keeps it a real gate
          # — an unverified claim still fails the job.
          #
          # The mismatch is a finding about the profile, not about this repo.
          globs: "openspec/**/*.md" "spec/**/*.md"
          require-markers: false
          strict: true
          run-report: true
