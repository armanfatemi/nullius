# .github/workflows/claims.yml — generated by `nullius-kit init`.
# Re-render with `nullius-kit doctor --fix`; edits here are overwritten.

name: claims
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git show <rev>:<path>` needs the commit an anchor names. Without
          # this, every rev-stamped anchor degrades to the advisory
          # UNVERIFIABLE-REV and the gate silently stops gating.
          fetch-depth: 0
      - uses: armanfatemi/nullius/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          globs: "openspec/**/*.md"
          require-markers: true
          strict: true
          run-report: true
