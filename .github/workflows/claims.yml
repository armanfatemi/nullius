# .github/workflows/claims.yml — DIVERGED from what `nullius-kit init` renders,
# on purpose, and the divergence is the point of `add-local-checker-binary`.
#
# `doctor --fix` re-renders this file from the profile and would revert every
# line below that a generated workflow does not carry: the local `uses:`, the
# build steps, and `NULLIUS_CLAIMS_BIN`. If you run it, put them back.
#
# Every other repository gets the generated form — the published action, the
# pinned checker, no build. This one is the repository that DEVELOPS the
# checker, and it is the one place where a pull-request comment produced by
# last week's release is worse than useless: it reports on code the pull
# request is changing, and it has three times been mistaken for a report on
# the change itself.

name: claims
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  claims:
    runs-on: ubuntu-latest
    env:
      # Job level rather than step level, so it reaches the composite action's
      # own `run:` steps without depending on how a step-level `env:` block
      # propagates into a composite. The action word-splits it, so the two
      # words below arrive as `node` and the built entry point.
      #
      # This is the whole opt-out: unset — every other caller — the action
      # installs the pinned `claims-version` exactly as before.
      NULLIUS_CLAIMS_BIN: node ${{ github.workspace }}/packages/claims/dist/cli.js
    steps:
      - uses: actions/checkout@v4
        with:
          # `git show <rev>:<path>` needs the commit an anchor names. Without
          # this, every rev-stamped anchor degrades to the advisory
          # UNVERIFIABLE-REV and the gate silently stops gating.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `dist/` is what the CLI runs, so an unbuilt tree would check this pull
      # request with the PREVIOUS commit's checker and report success on work
      # that does not exist yet — the same defect as `build-before-cli`, one
      # layer out. Without this step `NULLIUS_CLAIMS_BIN` names a file that is
      # not there.
      - run: pnpm build

      # `./action`, not `armanfatemi/nullius/action@v1`. The override is only
      # read by an action that knows about it, and the tag will not until this
      # change is released; pointing at the published action here would set the
      # variable and change nothing, which is the failure this whole change is
      # about. A fork's pull request already supplies this workflow file on
      # `pull_request`, and already runs with a read-only token and no secrets,
      # so running the in-tree action grants it nothing it did not have.
      - uses: ./action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          globs: "openspec/**/*.md"
          require-markers: true
          strict: true
          run-report: true
